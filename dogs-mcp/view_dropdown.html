<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dog images</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background-color: #77c;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    img {
      max-height: 400px;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    form { 
      margin-top: 14px; 
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.92);
      color: #111;
    }

    select {
      min-width: 240px;
      appearance: none;
    }

    button {
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.98);
    }

    button:active {
      transform: translateY(1px);
    }

    select:focus, button:focus {
      outline: 2px solid rgba(255,255,255,0.55);
      outline-offset: 2px
    }
  </style>

  <script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

    const app = new App({ name: "Dog viewer", version: "1.1" });

    const form = document.querySelector("form");
    const select = document.querySelector("select");

    function updateImgUrl(content) {
      const imgUrl = content[0].text;
      const img = document.querySelector('img');
      img.src = imgUrl;
    }
    
    app.ontoolresult = ({ content }) => {
      updateImgUrl(content);
    };

    await app.connect();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const breed = select.value;
      if (!breed) return;

      const result = await app.callServerTool({
        name: "get_dog_by_breed",
        arguments: { breed },
      });
      
      updateImgUrl(result?.content);
    });
  </script> 
</head>

<body>
  <img />
  <form>
    <select>
      <option value="">(choose one)</option>
      <option value="bullterrier/staffordshire">pit bull</option>
      <option value="doberman">doberman</option>
      <option value="malamute">malamute</option>
      <option value="pekinese">pekinese</option>
      <option value="pug">pug</option>
    </select>
    <button type="submit">Get my dog</button>
  </form>
</body>
